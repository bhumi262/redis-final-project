
---
# Install Redis and Sentinel on all private Redis nodes
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Redis server and Sentinel
  ansible.builtin.apt:
    name:
      - redis-server
      - redis-sentinel
    state: present

# Configure Redis authentication and replication
- name: Deploy Redis configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /etc/redis/redis.conf
    owner: redis
    group: redis
    mode: "0640"
  notify: Restart Redis

# Configure Sentinel on each node
- name: Deploy Sentinel configuration
  ansible.builtin.template:
    src: sentinel.conf.j2
    dest: /etc/redis/sentinel.conf
    owner: redis
    group: redis
    mode: "0640"
  notify: Restart Sentinel

# Ensure Redis is running before Sentinel starts
- name: Enable and start Redis
  ansible.builtin.systemd:
    name: redis-server
    enabled: yes
    state: started

# Apply pending Redis configuration before starting Sentinel
- name: Apply Redis configuration changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start Sentinel
  ansible.builtin.systemd:
    name: redis-sentinel
    enabled: yes
    state: started
